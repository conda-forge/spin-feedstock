schema_version: 1

context:
  name: spin
  version: "0.19"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/spin-${{ version }}.tar.gz
  sha256: 708b81ccb578dbe8d83458a3dd240a5801c5922576ec1e0f78483f3e5e212b7e

build:
  number: 0
  noarch: python
  script: uv pip install --python ${{ PYTHON }} . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - spin = spin.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - uv
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=8,!=8.3.0,<8.4
    - tomli
    - importlib-metadata >=7.0
    - if: win
      then: colorama
    - if: unix
      then: __unix
    - if: win
      then: __win

tests:
  - python:
      imports:
        - spin
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check

about:
  summary: Developer tool for scientific Python libraries
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scientific-python/spin

extra:
  recipe-maintainers:
    - stefanv
    - rgommers
    - lucascolley
